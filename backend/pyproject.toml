# The backend is not installed as a package — CI and the Dockerfile both use
# `pip install -r requirements.txt` — so nothing enforced a Python floor
# before this. Without one, a bump like `numpy>=2.5` (which needs 3.12)
# resolves locally and fails at build time. Keep the ceiling below the oldest
# dependency that forces a floor raise, and raise it deliberately.
[project]
name = "vrp-logistics-backend"
version = "1.0.0"
requires-python = ">=3.11,<3.14"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["B008", "ARG001", "SIM102"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
concurrency = ["thread"]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
