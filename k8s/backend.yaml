---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: vrp-production
  name: vrp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vrp-backend
  template:
    metadata:
      labels:
        app: vrp-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: ghcr.io/siva-balan-v/vrp-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: vrp-env
          env:
            - name: LOG_FORMAT
              value: "json"
            - name: DEBUG
              value: "false"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  namespace: vrp-production
  name: vrp-backend
spec:
  selector:
    app: vrp-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: vrp-production
  name: vrp-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vrp-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
