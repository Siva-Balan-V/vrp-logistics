---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: vrp-production
  name: vrp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vrp-frontend
  template:
    metadata:
      labels:
        app: vrp-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/siva-balan-v/vrp-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  namespace: vrp-production
  name: vrp-frontend
spec:
  selector:
    app: vrp-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: vrp-production
  name: vrp-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: vrp.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: vrp-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: vrp-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: vrp-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vrp-frontend
                port:
                  number: 80
