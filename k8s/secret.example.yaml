---
# vrp-env Secret template — COPY TO secret.yaml, fill real values, then apply.
# All values must be base64-encoded:  echo -n '<value>' | base64
# The backend, redis, and postgres manifests reference this Secret by name.
apiVersion: v1
kind: Secret
metadata:
  name: vrp-env
  namespace: vrp-production
type: Opaque
stringData:
  # Auth (REQUIRED — change in production)
  JWT_SECRET_KEY: "CHANGE-ME-IN-PRODUCTION"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  # Redis (required for caching / WebSocket progress)
  REDIS_PASSWORD: "CHANGE-ME"
  REDIS_URL: "redis://:CHANGE-ME@redis:6379/0"

  # PostgreSQL (required for job persistence / multi-tenant features)
  POSTGRES_PASSWORD: "CHANGE-ME"
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE-ME@postgres:5432/vrp"

  # Routing
  ROUTING_BACKEND: "haversine"
  ORS_API_KEY: ""            # optional — needed for ORS backend and traffic mode
  OSRM_BASE_URL: "http://router.project-osrm.org"

  # CORS — must include the public hostname
  ALLOWED_ORIGINS: '["https://vrp.example.com"]'

  # Observability
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  LOG_FILE: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""   # optional — OTLP gRPC collector, e.g. "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "vrp-backend"

  # Billing / notifications (optional)
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_EMAIL: ""
